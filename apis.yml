aid: lootrush
name: LootRush
description: >-
  LootRush is a gaming and crypto platform (backed by Paradigm) that publishes a Partner
  API for marketplace integrations: initiating and tracking on-chain cryptocurrency
  withdrawals, querying a user's transaction and activity history, and OAuth-style
  consented access to user data via a Connect API. LootRush also runs a published,
  read-only Model Context Protocol (MCP) server at mcp.lootrush.com that lets an AI
  assistant read the key-holder's own balance, cards, card transactions, and account
  history — every call scoped to the API key's user. Authentication is per-user bearer
  tokens (Withdraw, History, MCP) and integration API keys (Connect).
